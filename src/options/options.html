<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <title>YT Music Lyrics</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      padding: 20px;
      background: #1a1a1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .header img { width: 28px; height: 28px; border-radius: 6px; }
    .header h1 { font-size: 15px; font-weight: 600; }
    .header span { font-size: 11px; color: #888; margin-left: auto; }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
    }
    .toggle-label { font-size: 14px; font-weight: 500; }
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #444;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .slider { background: #4CAF50; }
    .toggle input:checked + .slider::before { transform: translateX(20px); }
    .divider { height: 1px; background: #333; margin: 4px 0; }
    .status {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="https://better-lyrics.boidu.dev/icon-512.png" alt="icon">
    <h1>YT Music Lyrics</h1>
    <span>v3.0</span>
  </div>
  <div class="divider"></div>
  <div class="toggle-row">
    <span class="toggle-label">Lyrics Overlay</span>
    <label class="toggle">
      <input type="checkbox" id="aml-enabled" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div class="divider"></div>
  <div id="status" class="status"></div>

  <script src="options.ts"></script>
</body>
</html>
