<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 260px;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                 "Helvetica Neue", Arial, sans-serif;
    background: #1a1a1a;
    color: #fff;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }

  .header h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .header span {
    font-size: 18px;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
  }

  .toggle-label {
    font-size: 13px;
    color: rgba(255,255,255,0.8);
  }

  .switch {
    position: relative;
    width: 44px;
    height: 24px;
    cursor: pointer;
  }

  .switch input { opacity: 0; width: 0; height: 0; }

  .slider {
    position: absolute;
    inset: 0;
    background: #444;
    border-radius: 12px;
    transition: background 0.25s ease;
  }

  .slider::before {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    left: 3px;
    bottom: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.25s ease;
  }

  .switch input:checked + .slider {
    background: #fa2d48;
  }

  .switch input:checked + .slider::before {
    transform: translateX(20px);
  }

  .status {
    margin-top: 14px;
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="header">
    <span>&#9835;</span>
    <h1>Apple-Style Lyrics</h1>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Enable styling</span>
    <label class="switch">
      <input type="checkbox" id="toggle" checked />
      <span class="slider"></span>
    </label>
  </div>

  <div class="status" id="status">Active on YouTube Music</div>

  <script src="popup.js"></script>
</body>
</html>
